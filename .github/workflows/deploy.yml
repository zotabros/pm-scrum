name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_DIR: /www/wwwroot/scrum.dzapp.io.vn
  PM2_APP: pm-scrum-bot

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (build deps)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Sync code to deploy dir
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR/data"
          rsync -a --delete \
            --exclude='.env' \
            --exclude='config.yaml' \
            --exclude='data/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='launchd/' \
            --exclude='systemd/' \
            --exclude='*.log' \
            ./ "$DEPLOY_DIR/"

      - name: Install prod deps in deploy dir
        run: |
          cd "$DEPLOY_DIR"
          npm ci --omit=dev

      - name: First-run scaffolding
        run: |
          cd "$DEPLOY_DIR"
          [ -f config.yaml ] || cp config.yaml.example config.yaml
          [ -f data/subscriptions.json ] || npx tsx scripts/migrate-subscriptions.ts || true

      - name: Reload PM2 app
        run: |
          cd "$DEPLOY_DIR"
          if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
            pm2 reload ecosystem.config.cjs --only "$PM2_APP" --update-env
          else
            pm2 start ecosystem.config.cjs --only "$PM2_APP"
          fi
          pm2 save
